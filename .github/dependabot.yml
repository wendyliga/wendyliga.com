# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This site has no go.mod / package.json: Hugo is installed as a binary in CI
# and the Congo theme is a Git submodule. The only real dependencies are the
# actions used by .github/workflows and the theme submodule.

version: 2
updates:
  # Actions used by .github/workflows/hugo.yaml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # themes/congo (tracks the branch pinned in .gitmodules)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
