# Builds the site for every pull request so template, shortcode, and content
# errors surface before merge, checks the result for broken internal links, and
# lints the workflows and shell scripts. Pushes to main run it too, to save the
# Hugo cache that pull requests reuse. Cloudflare Pages deploys the site.
# Pull requests from forks are skipped.
name: CI

on:
  # ready_for_review on top of the default types: the Hugo release check opens
  # its pull request with GITHUB_TOKEN, which starts no workflows, so marking
  # that draft ready is what runs CI on it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

# Read-only: this workflow runs code from the pull request and never deploys.
permissions:
  contents: read

# A newer push to the same pull request, or to main, replaces the build still
# in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build site
    # Branches of this repository only: nothing runs for a pull request from a
    # fork. A fork can edit this file and drop the condition, so the gate that
    # holds is the repository setting that makes fork runs wait for approval.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep in step with scripts/cloudflare-build.sh, so a green check here means
    # the deploy build passes too. Dart Sass is left out: nothing in the site or
    # the theme compiles Sass. hugo-release.yaml copies the install, cache, and
    # build steps from here to try a newer Hugo; change them there too.
    env:
      HUGO_ENVIRONMENT: production
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Read Hugo version
        run: |
          set -euo pipefail
          test -f .hugo-version || { echo "::error::.hugo-version is missing"; exit 1; }
          version="$(tr -d '[:space:]' < .hugo-version)"
          test -n "$version" || { echo "::error::.hugo-version is empty"; exit 1; }
          echo "HUGO_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      # Only pushes to main save the cache of processed images. Pull requests
      # reuse it, so only new images are processed, and never write one of
      # their own: a pull request's cache is visible to that pull request only.
      - name: Cache Restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build with Hugo
        run: hugo --gc --minify --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache Save
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      # Hugo does not validate plain Markdown links or raw HTML. Locally this
      # is `make check-links`.
      - name: Check internal links
        run: python3 scripts/check-links.py public

  # Locally this is `make lint`.
  lint:
    name: Lint
    # The same guard as the build job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actionlint is not on the runner image. The checksum is the one published
    # with the release, for the linux_amd64 archive; change both together.
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          wget -O "${{ runner.temp }}/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${{ runner.temp }}/actionlint.tar.gz" | sha256sum --check
          mkdir "${{ runner.temp }}/actionlint"
          tar -xzf "${{ runner.temp }}/actionlint.tar.gz" --directory "${{ runner.temp }}/actionlint" actionlint
          echo "${{ runner.temp }}/actionlint" >> "$GITHUB_PATH"
      # actionlint runs ShellCheck, which the runner image ships, on every run:
      # block, but skips them silently if it is missing. Printing the version
      # first turns that into a failure.
      - name: Lint workflows
        run: |
          shellcheck --version
          actionlint -version
          actionlint
      # Runs after a failed workflow lint too, so one run reports both.
      - name: Lint shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck scripts/*.sh
