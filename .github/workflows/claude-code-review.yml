# Reviews every pull request with Claude Code and posts the findings as inline
# comments. Advisory only: it never approves, blocks, or pushes.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same pull request replaces the review still in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only apart from id-token, which the action exchanges for a Claude
    # GitHub App token; the comments are posted as that app.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # CLAUDE_CODE_OAUTH_TOKEN comes from `claude setup-token` and lasts a
      # year. Pull requests from forks get no secrets, so they are not reviewed.
      - name: Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action only starts the inline-comment server when it is named here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
