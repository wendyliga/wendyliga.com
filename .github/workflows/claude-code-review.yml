# Reviews the owner's pull requests with Claude Code on every push and posts the
# findings as inline comments. Advisory only: it never approves, blocks, or pushes.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same pull request replaces the review still in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Owner only. Forks and Dependabot get no secrets anyway, but any other
    # account with write access would, so everyone else is skipped outright:
    # the branch must live in this repository, and both the push and any re-run
    # must come from the repository owner. Drafts wait until marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only apart from id-token, which the action exchanges for a Claude
    # GitHub App token; the comments are posted as that app.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Pinned to a commit because this step holds the token; Dependabot keeps
      # the pin current. CLAUDE_CODE_OAUTH_TOKEN comes from `claude setup-token`
      # and lasts a year.
      - name: Review with Claude Code
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only numbers and hashes are interpolated here, never titles, branch
          # names, or other free text from the pull request.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            Review this pull request. This runs on every push, so start by
            reading what is already there.

            1. Read the pull request and its earlier comments with
               `gh pr view <number> --comments`, and the changes with
               `gh pr diff <number>`. Read CLAUDE.md and any files you need
               for context.
            2. Look for problems the changes introduce:
               - bugs: content, templates, shortcodes, scripts, or workflows
                 that will fail or behave wrongly
               - clear violations of a rule in CLAUDE.md that you can quote
               Report only what you are confident is real. Skip style
               preferences, nitpicks, and problems that were already there.
            3. Post each new finding as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`: a short description, plus a committable
               suggestion only when it fixes the problem completely. One
               comment per finding. Do not repeat a finding that your earlier
               summary already lists and that is still unchanged.
            4. Keep one summary comment up to date with
               `gh pr comment <number> --edit-last --create-if-none --body "..."`.
               Start it with `## Code review` and the head commit, list the
               open findings as `path:line` with one line each, then any
               earlier findings that are now fixed. With nothing open, say
               "No issues found."
          # Claude can read the checkout and run only these commands. The action
          # starts the inline-comment server only when it is named here.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
