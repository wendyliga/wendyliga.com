{{ $src := .Get "src" }}
{{ $url := printf "%s%s" (path.Dir .Page.RelPermalink) $src | relURL }}

<figure class="story-audio{{ with .Get "class" }} {{ . }}{{ end }}" data-audio-player>
    <audio{{ with .Get "id" }} id="{{ . }}"{{ end }} controls preload="{{ .Get "preload" | default "metadata" }}">
        <source src="{{ $url }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div class="story-audio__player" data-audio-controls hidden>
        <button class="story-audio__play" type="button" data-audio-play aria-label="Play story">
            <svg class="story-audio__icon" data-audio-icon="play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8.5 6.1v11.8a1 1 0 0 0 1.54.84l8.17-5.9a1 1 0 0 0 0-1.68l-8.17-5.9a1 1 0 0 0-1.54.84Z" />
            </svg>
            <svg class="story-audio__icon" data-audio-icon="pause" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path d="M7.25 5.5h3.5v13h-3.5zm6 0h3.5v13h-3.5z" />
            </svg>
        </button>
        <div class="story-audio__details">
            <div class="story-audio__meta">
                <span class="story-audio__title">{{ .Get "label" | default "Listen to the story" }}</span>
                <output class="story-audio__time" data-audio-time>0:00 / --:--</output>
            </div>
            <input
                class="story-audio__progress"
                data-audio-progress
                type="range"
                min="0"
                max="0"
                step="0.01"
                value="0"
                aria-label="Story playback position"
            >
            <div class="story-audio__footer">
                <div class="story-audio__aids" data-audio-aids hidden></div>
                <div class="story-audio__settings">
                    <button class="story-audio__chip story-audio__rate" type="button" data-audio-rate aria-label="Playback speed 1×">1×</button>
                    <button class="story-audio__chip story-audio__mute" type="button" data-audio-mute aria-label="Mute story">
                        <svg class="story-audio__icon" data-audio-icon="volume" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 8.5h2.6l3.75-3.2A1 1 0 0 1 13 6.06v11.88a1 1 0 0 1-1.65.76L7.6 15.5H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1Z" />
                            <path d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <svg class="story-audio__icon" data-audio-icon="muted" viewBox="0 0 24 24" aria-hidden="true" hidden>
                            <path d="M5 8.5h2.6l3.75-3.2A1 1 0 0 1 13 6.06v11.88a1 1 0 0 1-1.65.76L7.6 15.5H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1Z" />
                            <path d="m16.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
